/* transfer codes carry a checksum, so a hand-edited code is refused. It only stops casual editing; a determined
   player can always change a game that runs in their own browser, and since there is no leaderboard that only affects them */
function fnv(t){let h=0x811c9dc5;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(36)}
const SALT='obcine~zvon~1991';
function signSave(b64){return 'OB1.'+fnv(SALT+b64+SALT.length)+fnv(b64+SALT)+'.'+b64}
function unsign(code){const m=/^OB1\.([0-9a-z]+)\.(.+)$/.exec(code.replace(/\s+/g,''));if(!m)return null;return signSave(m[2])===code.replace(/\s+/g,'')?m[2]:null}

   earned (counted at this run's prices, so only for saves from this version on: older ones bought at older prices).

 for(let i=0;i<S.n;i++)t+=ocost(i);return t}

try{const o=+localStorage.getItem(OSEL);if(o&&!S.osel)S.osel=o}catch(e){}

 let a,b;if(i<0){a='premakni miško ali tapni občino.';b='o sedež  O mestna občina  @ Ljubljana  ? naslednja  . zaklenjena'}
 else{const o=O[i];const known=i<=S.n+2;a=(known?o.n:'??????')+(o.u&&known?' (MO)':'')+' · '+num(o.p)+' preb. · '+o.a+' km² · '+REG[o.r][1];if(L(a)>iw)a=(known?ab(o.n,18):'??????')+(o.u&&known?' (MO)':'')+' · '+num(o.p)+' preb. · '+o.a+' km² · '+ab(REG[o.r][1],14);
  b=i<S.n?'odklenjena · #'+(i+1)+(LMAT[i]?' · znamenitost: '+LMAT[i].name:''):i===S.n?'naslednja · '+fmt(ocost(i))+' SIT':'zaklenjena · #'+(i+1)}
 const k=a+b;if(!force&&k===infoKey)return;infoKey=k;
 let bl;if(i<0){const items=b.split('  ');bl=[];let cur='';items.forEach(it=>{if(cur&&L(cur)+2+L(it)>iw){bl.push(cur);cur=it}else cur=cur?cur+'  '+it:it});if(cur)bl.push(cur)}else bl=wrap(b,iw);
 const aw=wrap(a,iw);const lines=['',...aw.slice(0,2),...bl.slice(0,3-Math.min(2,aw.length))];while(lines.length<4)lines.push('');
 el.innerHTML=lines.map(l=>'| '+esc(padR(cut(l,iw),iw))+' |\n').join('')}
function bestGen(){let best=-1,bv=Infinity;GEN.forEach((g,k)=>{if(S.n<g[3])return;const v=gcost(k,1)/(GEN[k][2]*genMult(k));if(v<bv){bv=v;best=k}});return best}
function pGen(w){const iw=w-4;const ls=[];const wide=iw>=70;const bg=bestGen();
 GEN.forEach((g,k)=>{if(S.n<g[3]){if(S.n>=(GEN[k-1]||[])[3])ls.push(lr('???',' odpre se pri '+g[3]+' občinah',iw));return}
  const a=S.amt==='max'?Math.max(1,gmax(k)):S.amt;const c=gcost(k,a);const can=S.sit>=c&&(S.amt!=='max'||gmax(k)>0);
  const each=GEN[k][2]*genMult(k)*allMult()*kurMult();const label=S.amt===1?' KUPI ':' KUPI '+a+' ';
  const nm=g[0]+(k===bg?' *':'');if(wide){ls.push([padR(nm,13),padL(String(S.own[k]),5),'  ',padL(fmt(genIps(k)*kurMult(),1)+'/s',14),'  ',padL('+'+fmt(each,1)+'/s',13),'  ',padL(fmt(c),12),'  ',btn(label,'g'+k,can)])}
  else{ls.push(lr(nm+'  ×'+S.own[k],fmt(genIps(k)*kurMult(),1)+'/s',iw));ls.push(two(['  cena '+fmt(c)],[btn(label,'g'+k,can)],iw))}});
 ls.push('');ls.push('* najboljše razmerje med ceno in dohodkom');if(wide)ls.unshift([padR('',13),padL('kos',5),'  ',padL('skupaj',14),'  ',padL('vsak',13),'  ',padL('cena',12)]);
 const right=[];[1,10,100,'max'].forEach(a=>{right.push({t:'['+(a==='max'?'MAX':'×'+a)+']',a:'amt'+a,c:S.amt===a?'on':''})});
 return box('PROIZVODNJA',ls,w,right)}
function pUps(w){const iw=w-4;const U=upgrades();const ls=[];const max=MODE.startsWith('3')?9:6;
 if(!U.length)ls.push('ni novih izboljšav.');
 U.slice(0,max).forEach(u=>{const can=S.sit>=u.cost;const nw=wrap(u.name,iw-L(fmt(u.cost))-2);nw.forEach((l,j)=>ls.push(j===0?lr(l,fmt(u.cost),iw):l));
  const d=wrap(u.desc,iw-10);d.forEach((l,j)=>ls.push(j===d.length-1?two(['  '+l],[btn(' KUPI ','u'+u.id,can)],iw):['  '+l]))});
 if(U.length>max)ls.push('… in še '+(U.length-max));
 const nextLm=LM.find(l=>l.o>=S.n);if(nextLm){ls.push('');wrap('naslednja znamenitost: čez '+(nextLm.o-S.n+1)+' '+obc(nextLm.o-S.n+1),iw).forEach(l=>ls.push(l))}
 const aff=U.filter(u=>u.cost<=S.sit).length;return box('IZBOLJŠAVE',ls,w,aff>1?[btn(' KUPI VSE ','upall')]:['[ kupljenih '+S.ups.length+' ]'])}
const obc=n=>n%100===1?'občino':n%100===2?'občini':n%100===3||n%100===4?'občine':'občin';
function pReg(w){const iw=w-4;const rc=regCount();const ls=[];const bw=Math.max(8,iw-31);
 REG.forEach((r,i)=>{const done=rc[i]===RN[i];const nm=ab(r[1],iw-bw-12);ls.push([r[2]+' '+padR(nm,iw-bw-12),bar(rc[i]/RN[i],bw-2),' ',done?{t:padL('×1,25',8),c:'bold'}:padL(rc[i]+'/'+RN[i],8)])});
 return box('REGIJE',ls,w,['[ cela = ×1,25 ]'])}
function pList(w){const iw=w-4;const rows=MODE.startsWith('1')?10:16;if(regPage===null)regPage=Math.max(0,Math.min(O.length-rows,S.n-Math.floor(rows/2)));
 const ls=[];for(let i=regPage;i<Math.min(O.length,regPage+rows);i++){const o=O[i];const known=i<=S.n+2;
  const nm=known?o.n+(o.u?' (MO)':''):'?'.repeat(Math.min(12,L(o.n)));const mark=i<S.n?'x':i===S.n?'>':' ';const lm=LMAT[i]&&known?' *':'';
  const pre=mark+' '+String(i+1).padStart(3,'0')+' ',room=iw-11-L(pre);const nmF=known?ab(o.n,room-(o.u?5:0)-(lm?2:0))+(o.u?' (MO)':'')+lm:nm;
  const line=padR(pre+nmF,iw-10)+padL(num(o.p),10);ls.push(i===S.n?[{t:line,c:'on'}]:line)}
 ls.push('');ls.push(two([btn('<<','pg-'+rows),' ',btn('<','pg-1'),' ',btn('>','pg1'),' ',btn('>>','pg'+rows)],[btn(' NASLEDNJA ','pg0')],iw));
 ls.push('x odklenjena  > naslednja  * znamenitost');
 return box('REGISTER OBČIN',ls,w,['[ '+(regPage+1)+'-'+Math.min(O.length,regPage+rows)+' ]'])}
function pAch(w){const iw=w-4;const per=6;const pages=Math.ceil(ACH.length/per);achPage=(achPage+pages)%pages;const ls=[];
 ls.push(lr('dobljeno '+S.ach.length+'/'+ACH.length,'+'+S.ach.length+' % dohodka',iw));ls.push(bar(S.ach.length/ACH.length,iw-2));ls.push('');
 const isNew=id=>S.achT&&S.achT[id]&&Date.now()-S.achT[id]<6e5;
 ACH.slice(achPage*per,achPage*per+per).forEach(a=>{const got=S.ach.includes(a[0]);const nw=got&&isNew(a[0]);wrap((got||a[0]!=='tri'?a[1]:'???'),iw-4).forEach((l,j)=>ls.push(j?'    '+l:nw?[{t:'[!] '+l,c:'bold'}]:(got?'[x] ':'[ ] ')+l));wrap(a[2],iw-4).forEach(l=>ls.push('    '+l))});
 ls.push('');ls.push(two([btn('<','ach-1'),' ',btn('>','ach1')],[(achPage+1)+'/'+pages],iw));
 const nNew=S.ach.filter(isNew).length;return box('DOSEŽKI',ls,w,nNew?[{t:'[ novih: '+nNew+' ]',c:'bold'}]:[])}
function pRef(w){const iw=w-4;const g=votesGain();const ls=[];
 ls.push(lr('glasovi',S.votes+' (+'+S.votes*2+' %)',iw));ls.push(lr('referendumi',String(S.refs),iw));ls.push(lr('ob referendumu dobiš','+'+g,iw));
 const nextAt=(votesTotal()+1)**3*1e9;ls.push(lr('naslednji glas pri',fmt(nextAt),iw));ls.push('');
 wrap('Vsak glas da +2 % dohodka. Referendum ponastavi tolarje, občine, proizvodnjo in izboljšave. Glasovi in dosežki ostanejo.',iw).forEach(l=>ls.push(l));ls.push('');
 if(Date.now()<refArm)ls.push([btn(' RES? DA ','refyes'),' ',btn(' NE ','refno')]);else ls.push([btn(' RAZPIŠI REFERENDUM ','ref',g>=1)]);
 return box('REFERENDUM',ls,w)}
function pLog(w){const iw=w-4;const n=MODE.startsWith('1')?6:8;const ls=[];for(const e of S.log){const ws=wrap(e,iw-6);ws.forEach((l,j)=>ls.push(j?'      '+l:l));if(ls.length>=n)break}ls.length=Math.min(ls.length,n);while(ls.length<n)ls.push('');return box('DNEVNIK',ls,w)}
function pSet(w){const iw=w-4;const ls=[];
 ls.push([btn(S.sound?' zvok: vklopljen ':' zvok: izklopljen ','snd'),' ',btn(S.light?' tema: svetla ':' tema: temna ','thm')]);
 ls.push('');ls.push('tipke:');ls.push('  [preslednica]  pozvoni');ls.push('  [N]  odkleni naslednjo občino');ls.push('');
 wrap('Prenos igre: igra se shranjuje samo v tem brskalniku. Za prenos na drug telefon ali računalnik jo tu kopiraj, tam pa prilepi.',iw).forEach(l=>ls.push(l));
 ls.push([btn(' kopiraj igro ','exp'),' ',btn(' naloži ','imp')]);
 ls.push(['> ',{t:'                    ',raw:'<input id="impin" aria-label="Prilepi shranjeno igro" placeholder="prilepi tukaj">'}]);
 wrap(flash||'',iw).forEach(l=>ls.push(l));if(!flash)ls.push('');ls.push([Date.now()<resetArm?btn(' RES IZBRIŠEM VSE? ','rstyes'):btn(' začni čisto od začetka ','rst')]);ls.push('');
 wrap('Podatki: seznam občin na slovenski Wikipediji. Zemljevid je približek iz središč občin.',iw).forEach(l=>ls.push(l));
 return box('NASTAVITVE',ls,w)}

/* ================= RENDER ================= */
const PAN={bell:pBell,stat:pStat,next:pNext,gen:pGen,ups:pUps,reg:pReg,list:pList,ach:pAch,ref:pRef,log:pLog,set:pSet};
function put(id,html){if(cache[id]===html)return;const el=document.getElementById(id);if(!el)return;
 const act=document.activeElement;const fa=act&&el.contains(act)&&act.dataset?act.dataset.a:null;const inp=act&&act.id==='impin'?act.value:null;
 if(inp!==null&&id==='p-set')return;
 el.innerHTML=html;cache[id]=html;if(fa){const n=el.querySelector(`[data-a="${fa}"]`);if(n)n.focus({preventScroll:true})}}
let lastTitle='';function title(){const s=(kurPos?(Date.now()%1000<500?'(!) KURENT · ':'(.) KURENT · '):'')+fmt(Math.floor(S.sit))+' SIT · Občine';if(s!==lastTitle){document.title=s;lastTitle=s}}
function render(){put('head',pHead());title();renderDock();for(const id in PAN)if(PW[id])put('p-'+id,PAN[id](PW[id]));drawMap();mapInfo()}
function full(){cache={};mapKey='';render()}
let dockHTML='',bellSeen=true;const bellIO=new IntersectionObserver(es=>{for(const e of es)bellSeen=e.isIntersecting});let bellObserved=null;
function renderDock(){const d=document.getElementById('dock');const be=document.getElementById('p-bell');if(be&&be!==bellObserved){bellIO.disconnect();bellIO.observe(be);bellObserved=be}const on=MODE.startsWith('1')&&!bellSeen;d.hidden=!on;document.body.classList.toggle('docked',on);if(!on)return;
 const w=PW.bell||49;const left='tolarji '+fmt(Math.floor(S.sit));const right='+'+fmt(ips(),1)+'/s';const btnT='[  Z V O N I  ]';
 const h='<span>'+esc('+'+'-'.repeat(w-2)+'+')+'\n'+esc('| '+padR(left,w-L(right)-4)+right+' |')+'\n</span><span class="b" data-a="ring" role="button" tabindex="0">'+esc(' '.repeat(w))+'\n'+esc(padR(' '.repeat(Math.floor((w-L(btnT))/2))+btnT,w))+'\n'+esc(' '.repeat(w))+'</span>';
 if(h!==dockHTML){d.innerHTML=h;dockHTML=h}placeToast()}

/* ================= INPUT ================= */
function act(a){if(!a)return;
 if(a==='ring')return ring();
 if(a==='unlock'){unlock();return}
 if(a==='all'){let k=0;const f=S.n;while(unlock(true))k++;if(k){log('odklenjenih '+k+': '+O[f].n+(k>1?' … '+O[S.n-1].n:''));ding(660,.05)}return}
 if(a==='kurent')return catchKurent();
 if(a==='toast')return nextToast();
 if(a.startsWith('amt')){S.amt=a==='amtmax'?'max':+a.slice(3);return}
 if(/^g\d+$/.test(a))return buyGen(+a.slice(1));
 if(a==='upall'){let k=0;for(const u of upgrades()){if(u.cost<=S.sit){S.sit-=u.cost;S.ups.push(u.id);k++}}if(k){log('kupljenih izboljšav: '+k);ding(1175,.05)}return}
 if(a[0]==='u')return buyUp(a.slice(1));
 if(a.startsWith('pg')){const v=+a.slice(2);if(v===0)regPage=null;else {const rows=MODE.startsWith('1')?10:16;regPage=Math.max(0,Math.min(O.length-rows,(regPage===null?Math.max(0,Math.min(O.length-rows,S.n-Math.floor(rows/2))):regPage)+v))};return}
 if(a.startsWith('ach'))return achPage+=+a.slice(3);
 if(a==='ref'){refArm=Date.now()+5000;return}if(a==='refno'){refArm=0;return}if(a==='refyes'){refArm=0;return referendum()}
 if(a==='snd'){S.sound=S.sound?0:1;return}
 if(a==='thm'){S.light=S.light?0:1;document.documentElement.classList.toggle('light',!!S.light);return}
 if(a==='exp'){const t=btoa(unescape(encodeURIComponent(JSON.stringify(S))));try{navigator.clipboard.writeText(t).then(()=>flash='igra je kopirana. prilepi jo na drugi napravi.',()=>flash='kopiranje ni uspelo.')}catch(e){flash='kopiranje ni uspelo.'}return}
 if(a==='imp'){const v=(document.getElementById('impin')||{}).value||'';try{const s=JSON.parse(decodeURIComponent(escape(atob(v.trim()))));if(!Array.isArray(s.own))throw 0;S=Object.assign(fresh(),s);flash='igra naložena.';save();full()}catch(e){flash='to ni veljavna shranjena igra.'}return}
 if(a==='rst'){resetArm=Date.now()+4000;return}
 if(a==='rstyes'){S=fresh();resetArm=0;log('nova igra. pozvoni!');save();full();return}}
const target=e=>{let t=e.target.closest&&e.target.closest('[data-a]');if(!t&&e.clientX!=null){const el=document.elementFromPoint(e.clientX,e.clientY);t=el&&el.closest&&el.closest('[data-a]')}return t};
document.addEventListener('pointerdown',e=>{const t=target(e);if(t&&(t.dataset.a==='ring'||t.dataset.a==='kurent')){e.preventDefault();act(t.dataset.a);render()}});
document.getElementById('toast').addEventListener('click',()=>nextToast());
document.addEventListener('click',e=>{const t=target(e);if(!t||t.dataset.a==='ring'||t.dataset.a==='kurent')return;act(t.dataset.a);render()});
let typed='';
document.addEventListener('keydown',e=>{if(e.target.id==='impin')return;
 if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.a){e.preventDefault();if(!e.repeat){act(e.target.dataset.a);render()}return}
 if(e.code==='Space'){e.preventDefault();if(!e.repeat){ring();render()}return}
 if(e.key==='n'){unlock();render()}
 typed=(typed+e.key.toLowerCase()).slice(-7);if(typed==='triglav'&&!S.ach.includes('tri'))gotAch(ACH.find(a=>a[0]==='tri'))});
document.addEventListener('mouseover',e=>{const c=e.target.closest&&e.target.closest('#mapgrid i');if(!c)return;const i=+c.className.match(/c(\d+)/)[1];if(i!==hover){hover=i;document.getElementById('hov').textContent=`#mapgrid .c${i}{background:var(--fg);color:var(--bg)}`;mapInfo()}});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('#mapgrid')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('#mapgrid'))){hover=-1;document.getElementById('hov').textContent='';mapInfo()}});

/* ================= LOOP ================= */
function spawnKurent(){const M=mapFor(PW.map||48);const cells=[];for(let y=0;y<M.H-3;y++)for(let x=0;x<M.W-4;x++)if(M.g[y][x]>=0&&M.g[y+2][x+3]>=0)cells.push([x,y]);
 if(!cells.length)return;kurPos=cells[Math.floor(Math.random()*cells.length)];kurGone=Date.now()+13e3;drawMap(true);ding(392,.05,.4);setTimeout(()=>ding(392,.05,.4),180)}
let last=performance.now(),saveT=0,achT=0,partT=0;
function tick(){const now=performance.now(),dt=Math.min(3600,(now-last)/1000);last=now;const g=ips()*dt;S.sit+=g;S.life+=g;S.all+=g;
 if((partT+=dt)>.08){partT=0;parts.forEach(p=>p.age++);while(parts.length&&parts[0].age>14)parts.shift();if(swing>0)swing--}
 const t=Date.now();const kx=has(LM.find(l=>l.kind==='kur').id)?.6:1;
 if(!kurPos&&t>kurNext&&S.n>=3){spawnKurent();kurNext=t+(120e3+Math.random()*120e3)*kx}
 if(kurPos&&t>kurGone){kurPos=null;drawMap(true)}
 if((achT+=dt)>1){achT=0;checkAch()}
 if((saveT+=dt)>5){saveT=0;save()}
 render()}
document.documentElement.classList.toggle('light',!!S.light);
{const away=(Date.now()-S.save)/1000;if(away>60&&baseIps()>0){const g=baseIps()*Math.min(away,8*3600)*.5;S.sit+=g;S.life+=g;S.all+=g;log('med odsotnostjo ('+dur(away)+'): +'+fmt(g)+' SIT')}}
if(!S.log.length)log('dobrodošli. pozvoni, kupi njivo, odkleni Osilnico.');
const ro=new ResizeObserver(()=>{layout();render();placeToast()});ro.observe(document.documentElement);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{MODE='';layout();full()});
layout();full();setInterval(tick,100);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
}
</script>

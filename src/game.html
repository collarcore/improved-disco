/* VOICE: a municipal terminal from 1991, dry and a bit proud
   IDEA: a text-mode registry screen; every glyph sits on one character grid
   PICTURE: the ASCII map of Slovenia filling in, občina by občina
   COLOUR+TYPE: black and white only, inverse video for focus; IBM Plex Mono at one size
   LAYOUT: panels are ASCII boxes sized in characters; 3, 2 or 1 columns by screen width */
:root{--bg:#000;--fg:#f2f2f2}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}

<script>
{
/* ================= DATA ================= */
const RAW=/*DATA*/;
const MAPS=/*MAPS*/;
const O=RAW.map(([n,p,a,y,r,u])=>({n,p,a,y,r,u}));
const REG=[['Gorenjska','Gorenjska','^'],['Goriška','Goriška','%'],['Obalno-kraška','Obalno-kraška','='],['Primorsko-notran.','Primorsko-notranjska','&'],
 ['Osrednjeslovenska','Osrednjeslovenska','#'],['Zasavska','Zasavska','*'],['Savinjska','Savinjska','+'],['Koroška','Koroška','Y'],
 ['Podravska','Podravska','v'],['Pomurska','Pomurska','-'],['Posavska','Posavska','x'],['Jugovzhodna','Jugovzhodna Slovenija','T']];
const RI=Object.fromEntries(REG.map((r,i)=>[r[0],i]));O.forEach(o=>o.r=RI[o.r]);
const RN=REG.map((_,i)=>O.filter(o=>o.r===i).length);
const IDX=Object.fromEntries(O.map((o,i)=>[o.n,i]));
const TOTAL=O.reduce((s,o)=>s+o.p,0);
const GEN=[['Njiva',15,.1,0],['Kozolec',100,1,2],['Čebelnjak',1100,8,8],['Gostilna',12e3,47,18],['Vinska klet',130e3,260,30],['Žaga',1.4e6,1400,45],
 ['Rudnik',20e6,7800,62],['Toplice',330e6,44e3,80],['Smučišče',5.1e9,260e3,100],['Tovarna',75e9,1.6e6,125],['Pristanišče',1e12,10e6,150],['Elektrarna',14e12,65e6,175]];
const GPL=['njive','kozolci','čebelnjaki','gostilne','vinske kleti','žage','rudniki','toplice','smučišča','tovarne','pristanišča','elektrarne'];
const TIERS=[[10,10,'boljše orodje'],[25,100,'zadruga'],[50,1e4,'evropska sredstva'],[100,1e6,'digitalizacija'],[150,1e8,'zelena preobrazba'],[200,1e10,'pametna specializacija']];
const LM=[['Solčava','Logarska dolina','gen',0,2],['Kostel','Grad Kostel','click',0,2],['Šentrupert','Dežela kozolcev','gen',1,3],['Bovec','Rafting na Soči','gen',3,2],
 ['Ankaran','Najmlajša občina','glob',0,1.1],['Mežica','Podzemlje Pece','gen',6,2],['Kobarid','Hiša Franko','gen',3,3],['Žirovnica','Anton Janša','gen',2,3],
 ['Radenci','Radenska','gen',7,2],['Kranjska Gora','Planica','gen',8,2],['Žiri','Žirovski čevlji','pct',0,.01],['Bohinj','Triglavski narodni park','glob',0,1.15],
 ['Brda','Briška rebula','gen',4,3],['Vipava','Vipavski zelen','gen',4,2],['Moravske Toplice','Prekmurske terme','gen',7,2],['Cerklje na Gorenjskem','Krvavec','gen',8,2],
 ['Bled','Blejska kremšnita','gen',3,2],['Metlika','Metliška črnina','gen',4,2],['Ribnica','Suha roba','gen',5,3],['Lendava','Nafta Lendava','gen',6,2],
 ['Idrija','Rudnik živega srebra','gen',6,3],['Rogaška Slatina','Slatina','gen',7,3],['Ormož','Jeruzalem','gen',4,2],['Laško','Laško pivo','gen',3,2],
 ['Sežana','Kobilarna Lipica','pct',0,.02],['Kočevje','Kočevski pragozd','gen',5,2],['Trbovlje','Rudarska tradicija','gen',6,2],['Izola','Ribiško pristanišče','gen',10,2],
 ['Postojna','Postojnska jama','glob',0,1.25],['Piran','Sečoveljske soline','gen',10,2],['Murska Sobota','Prekmurska gibanica','gen',0,5],['Radovljica','Čebelarski muzej','gen',2,2],
 ['Škofja Loka','Škofjeloški pasijon','glob',0,1.1],['Ptuj','Kurentovanje','kur',0,1],['Krško','Jedrska elektrarna','gen',11,3],['Kamnik','Velika planina','gen',8,2],
 ['Nova Gorica','Trg Evrope','glob',0,1.1],['Velenje','Gospodinjski aparati','gen',9,2],['Novo mesto','Avtomobili in zdravila','gen',9,3],['Celje','Celjski grofje','glob',0,1.25],
 ['Koper','Luka Koper','gen',10,3],['Kranj','Prešernovo mesto','pct',0,.03],['Maribor','Stara trta','gen',4,3],['Ljubljana','Prestolnica','glob',0,2]]
 .map(([o,name,kind,t,v])=>({id:'lm'+IDX[o],o:IDX[o],name,kind,t,v}));
const LMAT=Object.fromEntries(LM.map(l=>[l.o,l]));
const CLK=[['k1','Pritrkavanje',50,200,2,0],['k2','Bronasti zvon',500,2e4,2,.01],['k3','Zvonik na hribu',2000,2e7,2,.01],['k4','Veliki zvon',6000,2e10,2,.02],['k5','Zvonovi vseh far',15000,2e13,2,.02]];
const C0=50,G=1.16,PDIV=20000,GROW=1.15;
const ocost=i=>Math.ceil(30*1.15**i*Math.exp(.08*i*(211-i)/211)+8*(i+1)**3);
const lmcost=l=>ocost(l.o)*3;

/* ================= STATE ================= */
const KEY='obcine-v2';
const fresh=()=>({sit:15,life:0,all:0,n:0,own:GEN.map(()=>0),ups:[],clicks:0,kur:0,t0:Date.now(),save:Date.now(),votes:0,refs:0,ach:[],log:[],won:0,amt:1,sound:1,light:0});
let S=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.own))S=Object.assign(fresh(),s)}catch(e){}
const has=id=>S.ups.includes(id);
let kurUntil=0,clkUntil=0,kurNext=Date.now()+90e3,kurPos=null,kurGone=0,hover=-1,regPage=null,achPage=0,refArm=0,resetArm=0,flash='';

/* ================= ECONOMY ================= */
function pop(){let p=0;for(let i=0;i<S.n;i++)p+=O[i].p;return p}
function regCount(){const c=REG.map(()=>0);for(let i=0;i<S.n;i++)c[O[i].r]++;return c}
const regsDone=()=>regCount().filter((c,i)=>c===RN[i]).length;
function genMult(k){let m=1;TIERS.forEach((t,ti)=>{if(has('t'+k+'_'+ti))m*=2});LM.forEach(l=>{if(l.kind==='gen'&&l.t===k&&has(l.id))m*=l.v});return m}
const globUp=()=>LM.reduce((m,l)=>l.kind==='glob'&&has(l.id)?m*l.v:m,1);
const popMult=()=>1+pop()/PDIV;
const regMult=()=>1.25**regsDone();
const achMult=()=>1+.01*S.ach.length;
const voteMult=()=>1+.02*S.votes;
const kurMult=()=>Date.now()<kurUntil?7:1;
const allMult=()=>popMult()*regMult()*achMult()*voteMult()*globUp();
const genIps=k=>S.own[k]*GEN[k][2]*genMult(k)*allMult();
function baseIps(){let s=0;for(let k=0;k<GEN.length;k++)s+=S.own[k]*GEN[k][2]*genMult(k);return s*allMult()}
const ips=()=>baseIps()*kurMult();
function clickVal(){let cm=1,pct=0;CLK.forEach(c=>{if(has(c[0])){cm*=c[4];pct+=c[5]}});LM.forEach(l=>{if(!has(l.id))return;if(l.kind==='click')cm*=l.v;if(l.kind==='pct')pct+=l.v});
 return (cm+pct*baseIps())*(Date.now()<clkUntil?77:1)*kurMult()}
const gcost=(k,a)=>GEN[k][1]*GROW**S.own[k]*(GROW**a-1)/(GROW-1);
const gmax=k=>Math.max(0,Math.floor(Math.log(S.sit*(GROW-1)/(GEN[k][1]*GROW**S.own[k])+1)/Math.log(GROW)));
const votesTotal=()=>Math.floor(Math.cbrt(S.all/1e9));
const votesGain=()=>Math.max(0,votesTotal()-S.votes);
function upgrades(){const L=[];
 GEN.forEach((g,k)=>TIERS.forEach((t,ti)=>{if(S.own[k]>=t[0]&&!has('t'+k+'_'+ti))L.push({id:'t'+k+'_'+ti,name:g[0]+': '+t[2],desc:GPL[k]+' ×2',cost:g[1]*t[1]})}));
 LM.forEach(l=>{if(l.o<S.n&&!has(l.id))L.push({id:l.id,name:l.name,desc:lmDesc(l)+' · '+O[l.o].n,cost:lmcost(l)})});
 CLK.forEach(c=>{if(S.clicks>=c[2]&&!has(c[0]))L.push({id:c[0],name:c[1],desc:'klik ×'+c[4]+(c[5]?', +'+c[5]*100+' % dohodka na klik':''),cost:c[3]})});
 return L.sort((a,b)=>a.cost-b.cost)}
function lmDesc(l){const v=String(l.v).replace('.',',');return l.kind==='gen'?GPL[l.t]+' ×'+v:l.kind==='glob'?'vse ×'+v:l.kind==='click'?'klik ×'+v:l.kind==='pct'?'klik +'+Math.round(l.v*100)+' % dohodka':'kurent pogosteje, učinki 2× dlje'}

/* ================= ACHIEVEMENTS ================= */
const ACH=[];
[1,10,25,50,75,100,125,150,175,200,212].forEach(k=>ACH.push(['o'+k,k===1?'Prva občina':k===212?'Vsa Slovenija':k+' občin','odkleni '+k+' občin',()=>S.n>=k]));
REG.forEach((r,i)=>ACH.push(['r'+i,'Cela regija: '+r[1],'odkleni vse občine regije',()=>regCount()[i]===RN[i]]));
[[100,'Mežnar'],[1000,'Zvonar'],[10000,'Pritrkovalec'],[50000,'Zvon se ne ustavi']].forEach(([k,n])=>ACH.push(['c'+k,n,k.toLocaleString('sl-SI')+' klikov na zvon',()=>S.clicks>=k]));
[[1,'Pust je tu'],[10,'Kurentova druščina'],[50,'Zima je pregnana']].forEach(([k,n])=>ACH.push(['k'+k,n,'ujemi kurenta '+k+'×',()=>S.kur>=k]));
GEN.forEach((g,k)=>ACH.push(['g'+k,g[0]+' ×50','imej 50 '+GPL[k],()=>S.own[k]>=50]));
[[1e6,'Milijonar'],[1e9,'Milijardar'],[1e12,'Bilijonar'],[1e15,'Državni proračun'],[1e18,'Evropski proračun']].forEach(([k,n])=>ACH.push(['l'+k,n,'skupaj zaslužiš '+fmt(k)+' SIT',()=>S.all>=k]));
ACH.push(['ref1','Ljudstvo je odločilo','razpiši referendum',()=>S.refs>=1],['ref5','Večni referendum','razpiši 5 referendumov',()=>S.refs>=5],['tri','Na vrhu','skrivnost: natipkaj ime gore',()=>S.ach.includes('tri')]);
function checkAch(){for(const a of ACH){if(a[0]==='tri'||S.ach.includes(a[0]))continue;if(a[3]()){S.ach.push(a[0]);log('dosežek: '+a[1]+' (+1 %)')}}}

/* ================= FORMAT ================= */
function fmt(x,dec){if(!isFinite(x))return '∞';if(x<1e6){return x.toLocaleString('sl-SI',{maximumFractionDigits:dec&&x<100?1:0,useGrouping:'always'})}
 const sf=['mio','mrd','bil','bld','tril','trld','kvad','kvadd'];let k=Math.floor(Math.log10(x)/3)-2;if(k>=sf.length)return x.toExponential(2).replace('.',',');
 return (x/10**(3*k+6)).toLocaleString('sl-SI',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+sf[k]}
const num=x=>x.toLocaleString('sl-SI',{useGrouping:'always'});
const dur=s=>{s=Math.max(0,Math.round(s));if(s<60)return s+' s';const m=Math.floor(s/60);if(m<60)return m+' min';const h=Math.floor(m/60);return h<48?h+' h '+(m%60)+' min':Math.floor(h/24)+' dni'};
const L=s=>[...s].length;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const padR=(s,w)=>s+' '.repeat(Math.max(0,w-L(s)));
const padL=(s,w)=>' '.repeat(Math.max(0,w-L(s)))+s;
const cut=(s,w)=>L(s)>w?[...s].slice(0,Math.max(0,w-1)).join('')+'~':s;
function wrap(s,w){const out=[];let line='';for(const word of s.split(' ')){if(L(line)+L(word)+(line?1:0)>w){if(line)out.push(line);line=word}else line=line?line+' '+word:word}if(line)out.push(line);return out}

/* ================= TEXT UI ENGINE =================
   a "line" is an array of segments: string or {t,a,c} (a = action, c = css class) */
const sl=g=>L(typeof g==='string'?g:g.t);
function seg(g){if(typeof g==='string')return esc(g);const t=esc(g.t);
 if(g.raw)return g.raw;
 if(g.a)return `<span class="b${g.c?' '+g.c:''}" data-a="${g.a}" role="button" tabindex="0">${t}</span>`;return g.c?`<span class="${g.c}">${t}</span>`:t}
function fit(line,w){let h='',l=0;for(const g of line){const n=sl(g);if(l+n>w){if(typeof g==='string'){h+=esc([...g].slice(0,w-l).join(''));l=w}break}h+=seg(g);l+=n}return h+' '.repeat(w-l)}
const btn=(t,a,on=true,c)=>on?{t:'['+t+']',a,c}:{t:'('+t.trim().toLowerCase()+')'};
const two=(a,b,w)=>{const la=a.reduce((s,g)=>s+sl(g),0),lb=b.reduce((s,g)=>s+sl(g),0);return [...a,' '.repeat(Math.max(1,w-la-lb)),...b]};
const lr=(a,b,w)=>two([a],[b],w);
function box(title,lines,w,right=[]){const inner=w-4;
 const tl=['+-',{t:'[ '+title+' ]',c:'bold'}],tr=[...right,'-+'];const used=tl.reduce((s,g)=>s+sl(g),0)+tr.reduce((s,g)=>s+sl(g),0);
 let h=fit([...tl,'-'.repeat(Math.max(0,w-used)),...tr],w)+'\n';
 for(const ln of lines)h+='| '+fit(Array.isArray(ln)?ln:[ln],inner)+' |\n';
 return h+'+'+'-'.repeat(w-2)+'+'}
const bar=(f,w)=>{const k=Math.round(Math.max(0,Math.min(1,f))*w);return '['+'#'.repeat(k)+'.'.repeat(w-k)+']'};

/* ================= BIG DIGITS / BANNERS ================= */
const FIG={big:{"0": ["  ___  ", " / _ \\ ", "| | | |", "| |_| |", " \\___/ ", "       "], "1": [" _ ", "/ |", "| |", "| |", "|_|", "   "], "2": [" ____  ", "|___ \\ ", "  __) |", " / __/ ", "|_____|", "       "], "3": [" _____ ", "|___ / ", "  |_ \\ ", " ___) |", "|____/ ", "       "], "4": [" _  _   ", "| || |  ", "| || |_ ", "|__   _|", "   |_|  ", "        "], "5": [" ____  ", "| ___| ", "|___ \\ ", " ___) |", "|____/ ", "       "], "6": ["  __   ", " / /_  ", "| '_ \\ ", "| (_) |", " \\___/ ", "       "], "7": [" _____ ", "|___  |", "   / / ", "  / /  ", " /_/   ", "       "], "8": ["  ___  ", " ( _ ) ", " / _ \\ ", "| (_) |", " \\___/ ", "       "], "9": ["  ___  ", " / _ \\ ", "| (_) |", " \\__, |", "   /_/ ", "       "], ".": ["   ", "   ", "   ", " _ ", "(_)", "   "], ",": ["   ", "   ", "   ", " _ ", "( )", "|/ "], "-": ["       ", "       ", " _____ ", "|_____|", "       ", "       "], "+": ["       ", "   _   ", " _| |_ ", "|_   _|", "  |_|  ", "       "], "e": ["      ", "  ___ ", " / _ \\", "|  __/", " \\___|", "      "]},small:{"0": ["  __  ", " /  \\ ", "| () |", " \\__/ ", "      "], "1": [" _ ", "/ |", "| |", "|_|", "   "], "2": [" ___ ", "|_  )", " / / ", "/___|", "     "], "3": [" ____", "|__ /", " |_ \\", "|___/", "     "], "4": [" _ _  ", "| | | ", "|_  _|", "  |_| ", "      "], "5": [" ___ ", "| __|", "|__ \\", "|___/", "     "], "6": ["  __ ", " / / ", "/ _ \\", "\\___/", "     "], "7": [" ____ ", "|__  |", "  / / ", " /_/  ", "      "], "8": [" ___ ", "( _ )", "/ _ \\", "\\___/", "     "], "9": [" ___ ", "/ _ \\", "\\_, /", " /_/ ", "     "], ".": ["   ", "   ", " _ ", "(_)", "   "], ",": ["   ", "   ", " _ ", "( )", "|/ "], "-": ["     ", " ___ ", "|___|", "     ", "     "], "+": ["   _   ", " _| |_ ", "|_   _|", "  |_|  ", "       "], "e": ["     ", " ___ ", "/ -_)", "\\___|", "     "]}};
function big(str,f){const F=FIG[f];const h=F['0'].length;const r=Array(h).fill('');for(const ch of [...str]){const g=F[ch];if(!g)continue;for(let i=0;i<h;i++)r[i]+=(r[i]?' ':'')+g[i]}while(r.length&&!r[r.length-1].trim())r.pop();return r}
const BAN_BIG=[
'               \\/',
'  ___  ____   ____ ___ _   _ _____',
' / _ \\| __ ) / ___|_ _| \\ | | ____|',
'| | | |  _ \\| |    | ||  \\| |  _|',
'| |_| | |_) | |___ | || |\\  | |___',
' \\___/|____/ \\____|___|_| \\_|_____|'];
const BAN_SMALL=[
'             \\/',
'  ___  ___  ___ ___ _  _ ___',

function put(id,html){if(cache[id]===html)return;const el=document.getElementById(id);if(!el)return;
 const act=document.activeElement;const fa=act&&el.contains(act)&&act.dataset?act.dataset.a:null;const inp=act&&act.id==='impin'?act.value:null;
 if(inp!==null&&id==='p-set')return;
 el.innerHTML=html;cache[id]=html;if(fa){const n=el.querySelector(`[data-a="${fa}"]`);if(n)n.focus({preventScroll:true})}}
let lastTitle='';function title(){const s=(kurPos?(Date.now()%1000<500?'(!) KURENT · ':'(.) KURENT · '):'')+fmt(Math.floor(S.sit))+' SIT · Občine';if(s!==lastTitle){document.title=s;lastTitle=s}}
function render(){put('head',pHead());title();renderDock();for(const id in PAN)if(PW[id])put('p-'+id,PAN[id](PW[id]));drawMap();mapInfo()}
function full(){cache={};mapKey='';render()}
let dockHTML='';function renderDock(){const d=document.getElementById('dock');const on=MODE.startsWith('1');d.hidden=!on;document.body.classList.toggle('docked',on);if(!on)return;
 const w=PW.bell||49;const left='tolarji '+fmt(Math.floor(S.sit));const right='+'+fmt(ips(),1)+'/s';const btnT='[  Z V O N I  ]';
 const h='<span>'+esc('+'+'-'.repeat(w-2)+'+')+'\n'+esc('| '+padR(cut(left,w-L(right)-5),w-L(right)-4)+right+' |')+'\n</span><span class="b" data-a="ring" role="button" tabindex="0">'+esc(' '.repeat(w))+'\n'+esc(padR(' '.repeat(Math.floor((w-L(btnT))/2))+btnT,w))+'\n'+esc(' '.repeat(w))+'</span>';
 if(h!==dockHTML){d.innerHTML=h;dockHTML=h}}

/* ================= INPUT ================= */
function act(a){if(!a)return;
 if(a==='ring')return ring();
 if(a==='unlock'){unlock();return}
 if(a==='all'){let k=0;const f=S.n;while(unlock(true))k++;if(k){log('odklenjenih '+k+': '+O[f].n+(k>1?' … '+O[S.n-1].n:''));ding(660,.05)}return}
 if(a==='kurent')return catchKurent();
 if(a.startsWith('amt')){S.amt=a==='amtmax'?'max':+a.slice(3);return}
 if(/^g\d+$/.test(a))return buyGen(+a.slice(1));
 if(a[0]==='u')return buyUp(a.slice(1));
 if(a.startsWith('pg')){const v=+a.slice(2);if(v===0)regPage=null;else regPage=Math.max(0,Math.min(O.length-1,(regPage||0)+v));return}
 if(a.startsWith('ach'))return achPage+=+a.slice(3);
 if(a==='ref'){refArm=Date.now()+5000;return}if(a==='refno'){refArm=0;return}if(a==='refyes'){refArm=0;return referendum()}
 if(a==='snd'){S.sound=S.sound?0:1;return}
 if(a==='thm'){S.light=S.light?0:1;document.documentElement.classList.toggle('light',!!S.light);return}
 if(a==='exp'){const t=btoa(unescape(encodeURIComponent(JSON.stringify(S))));try{navigator.clipboard.writeText(t).then(()=>flash='shranjena igra je v odložišču.',()=>flash='kopiranje ni uspelo.')}catch(e){flash='kopiranje ni uspelo.'}return}
 if(a==='imp'){const v=(document.getElementById('impin')||{}).value||'';try{const s=JSON.parse(decodeURIComponent(escape(atob(v.trim()))));if(!Array.isArray(s.own))throw 0;S=Object.assign(fresh(),s);flash='igra naložena.';save();full()}catch(e){flash='to ni veljavna shranjena igra.'}return}
 if(a==='rst'){resetArm=Date.now()+4000;return}
 if(a==='rstyes'){S=fresh();resetArm=0;log('nova igra. pozvoni!');save();full();return}}
const target=e=>{let t=e.target.closest&&e.target.closest('[data-a]');if(!t&&e.clientX!=null){const el=document.elementFromPoint(e.clientX,e.clientY);t=el&&el.closest&&el.closest('[data-a]')}return t};
document.addEventListener('pointerdown',e=>{const t=target(e);if(t&&(t.dataset.a==='ring'||t.dataset.a==='kurent')){e.preventDefault();act(t.dataset.a);render()}});
document.addEventListener('click',e=>{const t=target(e);if(!t||t.dataset.a==='ring'||t.dataset.a==='kurent')return;act(t.dataset.a);render()});
let typed='';
document.addEventListener('keydown',e=>{if(e.target.id==='impin')return;
 if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.a){e.preventDefault();if(!e.repeat){act(e.target.dataset.a);render()}return}
 if(e.code==='Space'){e.preventDefault();if(!e.repeat){ring();render()}return}
 if(e.key==='n'){unlock();render()}
 typed=(typed+e.key.toLowerCase()).slice(-7);if(typed==='triglav'&&!S.ach.includes('tri')){S.ach.push('tri');log('dosežek: Na vrhu (+1 %)');ding(1319,.06,1.2)}});
document.addEventListener('mouseover',e=>{const c=e.target.closest&&e.target.closest('#mapgrid i');if(!c)return;const i=+c.className.match(/c(\d+)/)[1];if(i!==hover){hover=i;document.getElementById('hov').textContent=`#mapgrid .c${i}{background:var(--fg);color:var(--bg)}`;mapInfo()}});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('#mapgrid')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('#mapgrid'))){hover=-1;document.getElementById('hov').textContent='';mapInfo()}});

/* ================= LOOP ================= */
function spawnKurent(){const M=mapFor(PW.map||48);const cells=[];for(let y=0;y<M.H-3;y++)for(let x=0;x<M.W-4;x++)if(M.g[y][x]>=0&&M.g[y+2][x+3]>=0)cells.push([x,y]);
 if(!cells.length)return;kurPos=cells[Math.floor(Math.random()*cells.length)];kurGone=Date.now()+13e3;drawMap(true);ding(392,.05,.4);setTimeout(()=>ding(392,.05,.4),180)}
let last=performance.now(),saveT=0,achT=0,partT=0;
function tick(){const now=performance.now(),dt=Math.min(3600,(now-last)/1000);last=now;const g=ips()*dt;S.sit+=g;S.life+=g;S.all+=g;
 if((partT+=dt)>.08){partT=0;parts.forEach(p=>p.age++);while(parts.length&&parts[0].age>14)parts.shift();if(swing>0)swing--}
 const t=Date.now();const kx=has(LM.find(l=>l.kind==='kur').id)?.6:1;
 if(!kurPos&&t>kurNext&&S.n>=3){spawnKurent();kurNext=t+(120e3+Math.random()*120e3)*kx}
 if(kurPos&&t>kurGone){kurPos=null;drawMap(true)}
 if((achT+=dt)>1){achT=0;checkAch()}
 if((saveT+=dt)>5){saveT=0;save()}
 render()}
document.documentElement.classList.toggle('light',!!S.light);
{const away=(Date.now()-S.save)/1000;if(away>60&&baseIps()>0){const g=baseIps()*Math.min(away,8*3600)*.5;S.sit+=g;S.life+=g;S.all+=g;log('med odsotnostjo ('+dur(away)+'): +'+fmt(g)+' SIT')}}
if(!S.log.length)log('dobrodošli. pozvoni, kupi njivo, odkleni Osilnico.');
const ro=new ResizeObserver(()=>{layout();render()});ro.observe(document.documentElement);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{MODE='';layout();full()});
layout();full();setInterval(tick,100);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
}
</script>

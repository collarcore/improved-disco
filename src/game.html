/* VOICE: a municipal terminal from 1991, dry and a bit proud
   IDEA: a text-mode registry screen; every glyph sits on one character grid
   PICTURE: the ASCII map of Slovenia filling in, občina by občina
   COLOUR+TYPE: black and white only, inverse video for focus; IBM Plex Mono at one size
   LAYOUT: panels are ASCII boxes sized in characters; 3, 2 or 1 columns by screen width */
:root{--bg:#000;--fg:#f2f2f2}
:root.light{--bg:#fff;--fg:#000}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
html{overflow-anchor:none}
body{font:400 14px/1.25 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-ligatures:none;-webkit-font-smoothing:antialiased;overflow-x:hidden;user-select:none;-webkit-user-select:none}
#root{margin:0 auto;padding:1.25em 0 2.5em;display:flex;flex-direction:column;align-items:center}
#cols{display:flex;gap:0 2ch;align-items:flex-start}
.col{display:flex;flex-direction:column}
pre{margin:0 0 1.25em;font:inherit;white-space:pre;overflow:hidden}
.b{cursor:pointer;outline:none}
.b:focus-visible,.b:active,.on{background:var(--fg);color:var(--bg)}
@media(hover:hover){.b:hover{background:var(--fg);color:var(--bg)}}
.bell{cursor:pointer}
.hk,.sea{cursor:default}
.hv{cursor:default}@media(hover:hover){.hv:hover{text-decoration:underline}}.b.bell:hover,.b.bell:active{background:none;color:inherit}
.b.ring:active{background:none;color:inherit}
@media(hover:hover){.b.ring:hover:active{background:var(--fg);color:var(--bg)}}
.bold{font-weight:700}
.q{animation:bl 1s steps(1) infinite}
.b.ring.nudge{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{background:var(--fg);color:var(--bg)}}
.kur{cursor:pointer;animation:bl .5s steps(1) infinite}
.zm,.boat,.gull{cursor:pointer}
#mapgrid .tm{font-weight:700}
.gl{background:var(--fg);color:var(--bg)}
#mapgrid i{font-style:normal}
input{font:inherit;line-height:inherit;height:1lh;vertical-align:top;color:var(--fg);background:transparent;border:0;border-radius:0;outline:none;padding:0;margin:0;width:20ch;caret-color:var(--fg);-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#measure{position:fixed;left:0;top:0;visibility:hidden;white-space:pre;pointer-events:none}
/* no double-tap zoom anywhere, so fast taps on the bell all ring; pinch-zoom stays for anyone who needs bigger text */
html,body,*{touch-action:manipulation}
.b,.hk,.sea,.zm,.boat,[data-a]{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#toast{position:fixed;margin:0;background:var(--bg);padding:1.25em 0;z-index:20;cursor:pointer}
#toast[hidden]{display:none}#toast.pop{animation:tp .9s steps(1)}@keyframes tp{0%,30%,60%{background:var(--fg);color:var(--bg)}15%,45%,75%{background:var(--bg);color:var(--fg)}}
@media(prefers-reduced-motion:reduce){.q,.kur,#toast.pop,#mapgrid i,.b.ring.nudge{animation:none!important}.b.ring.nudge{background:var(--fg);color:var(--bg)}}
